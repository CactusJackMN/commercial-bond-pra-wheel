<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commercial Bond PRA Wheel</title>
<style>
:root{--bg:#0b1020;--panel:#121a30;--panel-2:#18233f;--line:#2a3a62;--text:#e8eefc;--muted:#93a0c2}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1020;color:var(--text);font-family:Segoe UI,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:#0b1020cc}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}
button,input[type=text]{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}button{cursor:pointer}
.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100% - 64px)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
.factor{display:grid;grid-template-columns:28px 1fr 44px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid #1c2744}
.idx,.name{font-size:12px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{width:100%;height:100%;display:block}
.modal-back{position:fixed;inset:0;background:#040812b8;display:none;align-items:center;justify-content:center;z-index:20}
.modal-back.open{display:flex}
.modal{width:min(980px,94vw);max-height:90vh;overflow:auto;background:#10182c;border:1px solid var(--line);border-radius:14px}
.node{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel-2);min-width:160px;text-align:center;font-size:13px}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px}
.col{display:flex;flex-direction:column;align-items:center}
.gate{font-size:10px;color:var(--muted);margin:6px 0;text-transform:uppercase}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hint{position:absolute;left:16px;bottom:14px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden}
</style></head><body>
<header><div><h1>Commercial Bond PRA Wheel</h1><div class="sub">28 surveillance factors · click a node for the PRA tree</div></div>
<div><button id="randomBtn">Sample scores</button> <button id="resetBtn">Reset mid</button> <button id="exportBtn">Download JSON</button></div></header>
<div class="layout"></div>
<script>
const FACTORS=[
{id:"claims",name:"Bond claims history",group:"Character",scope:"Specific",assess:"Prior and current claims, reserves, recoveries.",sources:["Internal loss runs","Obligee demand letters","Prior-surety loss runs"]},
{id:"suits",name:"Lawsuits, judgments, liens",group:"Character",scope:"General",assess:"Litigation, judgments, recorded liens.",sources:["PACER","County indexes","LexisNexis"]},
{id:"taxucc",name:"Tax liens and UCC filings",group:"Character",scope:"General",assess:"Tax liens and Article 9 filings.",sources:["IRS/state liens","SoS UCC","County tax liens"]},
{id:"bk",name:"Bankruptcy and insolvency",group:"Character",scope:"General",assess:"Ch. 7/11/13, receivership, ABC.",sources:["PACER BK","Bureau flags","Receivership notices"]},
{id:"trade",name:"Vendor and trade payment history",group:"Character",scope:"General",assess:"Pays suppliers and trade creditors on time.",sources:["D&B PAYDEX","NACM","Trade references"]},
{id:"integrity",name:"Management integrity / ownership change",group:"Character",scope:"General",assess:"Integrity, ownership change, key-person exit.",sources:["SoS filings","Adverse media","Field reports"]},
{id:"license",name:"Regulatory actions and license status",group:"Character",scope:"Specific",assess:"Suspensions, revocations, consent orders.",sources:["Licensing boards","Consent orders","Regulator notices"]},
{id:"media",name:"Reputation and adverse media",group:"Character",scope:"General",assess:"Public reputation hits.",sources:["News wires","Media scans","Complaint sites"]},
{id:"perform",name:"Ability to perform the obligation",group:"Capacity",scope:"Specific",assess:"Still licensed and operating in the bonded line.",sources:["License status","Site check","Producer"]},
{id:"experience",name:"Experience in the bonded line",group:"Capacity",scope:"Specific",assess:"Track record in the bonded activity.",sources:["Application","Prior-surety files","References"]},
{id:"ops",name:"Operational stability",group:"Capacity",scope:"General",assess:"Staffing, systems, locations.",sources:["Financial footnotes","Field inspection","Interview"]},
{id:"continuity",name:"Continuity of management / ownership",group:"Capacity",scope:"General",assess:"Key-person and control continuity.",sources:["Ownership records","Key-man files","Succession docs"]},
{id:"compliance",name:"Statutory / permit / contract compliance",group:"Capacity",scope:"Specific",assess:"Ongoing compliance with the rule that required the bond.",sources:["Obligee notices","Audits","Statute/permit"]},
{id:"stmts",name:"Financial statements",group:"Capital",scope:"General",assess:"Statement quality and timeliness.",sources:["CPA package","EDGAR","Comfort letters"]},
{id:"liquidity",name:"Working capital and liquidity",group:"Capital",scope:"General",assess:"Current ratio and cash.",sources:["Interims","Bank statements","Bureau liquidity"]},
{id:"profit",name:"Profitability and cash-flow trends",group:"Capital",scope:"General",assess:"Earnings and cash conversion.",sources:["Income stmt","Cash flow","Tax returns"]},
{id:"leverage",name:"Leverage and debt service",group:"Capital",scope:"General",assess:"Debt load and coverage.",sources:["Debt schedules","Credit agreements","Bureau leverage"]},
{id:"bizcredit",name:"Business credit scores",group:"Capital",scope:"General",assess:"Commercial bureau scores.",sources:["D&B","Experian Biz","Equifax Commercial"]},
{id:"perscredit",name:"Personal credit of owners / indemnitors",group:"Capital",scope:"General",assess:"Consumer-bureau condition of indemnitors.",sources:["Experian","Equifax","TransUnion"]},
{id:"taxret",name:"Tax returns and tax-compliance status",group:"Capital",scope:"General",assess:"Filing status and tax liabilities.",sources:["Business returns","Personal returns","Transcripts"]},
{id:"distress",name:"Public-record financial distress signals",group:"Capital",scope:"General",assess:"Deterioration vs underwriting in public records.",sources:["Bureau public records","D&B stress","News/court"]},
{id:"collateral",name:"Status and value of pledged collateral",group:"Collateral",scope:"Specific",assess:"Existence, perfection, current value.",sources:["Custodian","Appraisals","UCC-1"]},
{id:"indemnity",name:"Indemnity agreements still in force",group:"Collateral",scope:"Specific",assess:"GAI still binding and collectible.",sources:["GAI file","Counsel","Authority docs"]},
{id:"guarantor",name:"Personal guarantor financial condition",group:"Collateral",scope:"General",assess:"Indemnitor net worth and collectability.",sources:["PFS","Bureaus","Tax returns"]},
{id:"macro",name:"Industry and macroeconomic conditions",group:"Conditions",scope:"General",assess:"Cycle, rates, unemployment, sector policy.",sources:["BLS/Fed","Industry data","Political risk notes"]},
{id:"bondform",name:"Bond-form and obligation changes",group:"Conditions",scope:"Specific",assess:"Hazardous clauses and form revisions.",sources:["Bond file","Obligee forms","SFAA notes"]},
{id:"concentration",name:"Exposure concentration",group:"Conditions",scope:"General",assess:"Single-name, industry, or geo clusters.",sources:["Exposure reports","Producer reports","Geo maps"]},
{id:"cadence",name:"Monitoring cadence vs. credit quality",group:"Conditions",scope:"General",assess:"Review frequency vs residual risk.",sources:["Surveillance calendar","Rating policy","Exception logs"]}
];
function treeFor(f){return{top:f.name+" impairs recoverability of the bonded obligation",ands:[{title:"Condition deteriorates",leaves:[f.assess,"Change is material vs underwriting","Signal confirmed"]},{title:"Surveillance / control gap",leaves:["Source stale or missing","No timely escalation","No residual mitigation"]}],ors:[{title:"Loss path",leaves:["Claim / forfeiture","Uncollectible indemnity","Reserve / capital hit"]},{title:"Book path",leaves:["Rating downgrade","Capacity cut","Cluster loss"]}],notes:"Sources: "+f.sources.join(" · ")+" · Scope: "+f.scope}}
const TREES=Object.fromEntries(FACTORS.map(f=>[f.id,treeFor(f)]));
const state={investment:"Subject commercial bond / principal",scores:Object.fromEntries(FACTORS.map(f=>[f.id,5]))};
function riskColor(s){return s<=3?"#34d399":s<=5?"#fbbf24":s<=7?"#f97316":"#ef4444"}
function riskLabel(s){return s<=3?"Low":s<=5?"Moderate":s<=7?"Elevated":"Critical"}
function thickness(s){return 1.4+(s/10)*7.5}
function renderSidebar(){const el=document.getElementById("sidebar");el.innerHTML=`<label class="sub">Hub name</label><input id="invName" type="text" value="${state.investment}" style="width:100%;margin:6px 0 12px">`+FACTORS.map((f,i)=>`<div class="factor"><div class="idx">${String(i+1).padStart(2,"0")}</div><div><div class="name" title="${f.group} · ${f.scope}">${f.name}</div><input type="range" min="1" max="10" value="${state.scores[f.id]}" data-id="${f.id}"></div><div style="color:${riskColor(state.scores[f.id])}">${state.scores[f.id]}</div></div>`).join("");el.querySelector("#invName").oninput=e=>{state.investment=e.target.value||"Subject";draw()};el.querySelectorAll("input[type=range]").forEach(r=>r.oninput=e=>{state.scores[e.target.dataset.id]=+e.target.value;renderSidebar();draw()})}
function draw(){const svg=document.getElementById("wheel");const W=svg.clientWidth||900,H=svg.clientHeight||700,cx=W/2,cy=H/2,R=Math.min(W,H)*0.36,n=FACTORS.length;let spokes="",nodes="",labels="";FACTORS.forEach((f,i)=>{const ang=-Math.PI/2+(i/n)*Math.PI*2,x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R,s=state.scores[f.id],col=riskColor(s);spokes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${thickness(s)}" stroke-linecap="round"/>`;nodes+=`<circle class="risk-node" data-id="${f.id}" cx="${x}" cy="${y}" r="${9+s*0.7}" fill="${col}" stroke="#0b1020" stroke-width="2" style="cursor:pointer"/>`;const lx=cx+Math.cos(ang)*(R+36),ly=cy+Math.sin(ang)*(R+36),anchor=Math.cos(ang)>0.15?"start":Math.cos(ang)<-0.15?"end":"middle";labels+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" fill="#c9d4f0" font-size="11" class="risk-node" data-id="${f.id}" style="cursor:pointer">${i+1}. ${f.name}</text>`});const agg=FACTORS.reduce((a,f)=>a+state.scores[f.id],0)/n;svg.innerHTML=spokes+`<circle cx="${cx}" cy="${cy}" r="58" fill="#1e3a5f" stroke="${riskColor(agg)}" stroke-width="4"/><text x="${cx}" y="${cy-8}" text-anchor="middle" fill="#7dd3fc" font-size="12">BOND / PRINCIPAL</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="#e8eefc" font-size="13">${escapeXml((state.investment||"").slice(0,22))}</text><text x="${cx}" y="${cy+28}" text-anchor="middle" fill="${riskColor(agg)}" font-size="11">agg ${agg.toFixed(1)} / 10</text>`+nodes+labels;svg.querySelectorAll(".risk-node").forEach(el=>el.onclick=()=>openTree(el.dataset.id))}
function escapeXml(s){return s.replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]))}
function openTree(id){const f=FACTORS.find(x=>x.id===id),t=TREES[id],s=state.scores[id];document.getElementById("modalTitle").textContent="PRA tree · "+f.name;document.getElementById("modalSub").textContent=`${state.investment} · ${s}/10 (${riskLabel(s)}) · ${f.group} · ${f.scope}`;document.getElementById("modalBody").innerHTML=`<div class="meta"><div class="kpi"><span class="sub">Score</span><b style="color:${riskColor(s)}">${s}/10</b></div><div class="kpi"><span class="sub">Band</span><b>${riskLabel(s)}</b></div><div class="kpi"><span class="sub">Group</span><b>${f.group}</b></div><div class="kpi"><span class="sub">Scope</span><b>${f.scope}</b></div></div><div style="text-align:center"><div class="node">${t.top}</div><div class="gate">AND</div><div class="row">${t.ands.map(b=>`<div class="col"><div class="node">${b.title}</div><div class="gate">OR</div>${b.leaves.map(l=>`<div class="node" style="margin:4px 0">${l}</div>`).join("")}</div>`).join("")}</div><div class="gate">OR — consequence channels</div><div class="row">${t.ors.map(b=>`<div class="col"><div class="node">${b.title}</div>${b.leaves.map(l=>`<div class="node" style="margin:4px 0">${l}</div>`).join("")}</div>`).join("")}</div><p class="sub">${t.notes}</p></div>`;document.getElementById("modalBack").classList.add("open")}
document.addEventListener("DOMContentLoaded",()=>{document.querySelector(".layout").innerHTML=`<aside id="sidebar"></aside><main><svg id="wheel"></svg><div class="hint">Click a node to open its PRA tree.</div></main><div class="modal-back" id="modalBack"><div class="modal"><header><div><h1 id="modalTitle">PRA tree</h1><div class="sub" id="modalSub"></div></div><button id="closeModal">Close</button></header><div id="modalBody" style="padding:16px"></div></div></div>`;renderSidebar();draw();addEventListener("resize",draw);document.getElementById("closeModal").onclick=()=>document.getElementById("modalBack").classList.remove("open");document.getElementById("randomBtn").onclick=()=>{FACTORS.forEach(f=>state.scores[f.id]=1+Math.floor(Math.random()*10));renderSidebar();draw()};document.getElementById("resetBtn").onclick=()=>{FACTORS.forEach(f=>state.scores[f.id]=5);renderSidebar();draw()};document.getElementById("exportBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({investment:state.investment,scores:state.scores},null,2)]));a.download="pra-wheel-scores.json";a.click()}});
</script></body></html>
